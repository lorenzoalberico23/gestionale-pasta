<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica prenotazione</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f7fa; }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="container py-4">

<div class="container-box">
    <div class="title">✏️ Modifica prenotazione</div>

    <form method="POST">

        <label class="form-label">Nome cliente</label>
        <input type="text" name="nome" class="form-control" value="{{ prenotazione[1] }}" required>

        <label class="form-label mt-3">Telefono</label>
        <input type="text" name="telefono" class="form-control" value="{{ prenotazione[2] }}">

        <label class="form-label mt-3">Data ritiro</label>
        <input type="date" name="data" class="form-control" value="{{ prenotazione[3] }}" required>

        <label class="form-label mt-3">Fascia oraria</label>
        <select name="fascia" class="form-select">
            <option value="">-- Nessuna --</option>
            <option value="Mattina" {% if prenotazione[4] == "Mattina" %}selected{% endif %}>Mattina</option>
            <option value="Pomeriggio" {% if prenotazione[4] == "Pomeriggio" %}selected{% endif %}>Pomeriggio</option>
        </select>

        <label class="form-label mt-3">Note</label>
        <textarea name="note" class="form-control">{{ prenotazione[5] }}</textarea>

        <hr class="my-4">

        <h5>Prodotti</h5>

        <div id="prodotti-container">
            {% for det in dettagli %}
            <div class="row mb-2 align-items-center">
                <div class="col-4">
                    <select name="prodotto" class="form-select" onchange="cambiaQuantita(this); calcolaTotale();">
                        {% for p in prodotti %}
                            <option value="{{ p[0] }}" {% if p[0] == det[0] %}selected{% endif %}>
                                {{ p[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-3">
                    <input type="text" name="quantità"
                           class="form-control quantita-input"
                           value="{{ det[1] }}"
                           placeholder="kg o formato (1x2)"
                           oninput="calcolaTotale()">
                </div>

                <div class="col-3 text-end">
                    <span class="prezzo-unitario fw-bold">0.00 €</span>
                </div>

                <div class="col-2">
                    <button type="button" class="btn btn-danger w-100"
                            onclick="this.parentElement.parentElement.remove(); calcolaTotale();">
                        ✖
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>

        <button type="button" class="btn btn-primary mt-3" onclick="aggiungiProdotto()">
            ➕ Aggiungi prodotto
        </button>

        <h4 class="mt-4">Totale: <span id="totale">0.00</span> €</h4>

<script>
    const prezzi = {
        {% for p in prodotti %}
            "{{ p[0] }}": {{ p[2] }},
        {% endfor %}
    };

    function aggiungiProdotto() {
        const container = document.getElementById("prodotti-container");

        const div = document.createElement("div");
        div.classList.add("row", "mb-2", "align-items-center");

        div.innerHTML = `
            <div class="col-4">
                <select name="prodotto" class="form-select" onchange="cambiaQuantita(this); calcolaTotale();">
                    {% for p in prodotti %}
                        <option value="{{ p[0] }}">{{ p[1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-3">
                <input type="text" name="quantità"
                       class="form-control quantita-input"
                       placeholder="kg o formato (1x2)"
                       oninput="calcolaTotale()">
            </div>

            <div class="col-3 text-end">
                <span class="prezzo-unitario fw-bold">0.00 €</span>
            </div>

            <div class="col-2">
                <button type="button" class="btn btn-danger w-100"
                        onclick="this.parentElement.parentElement.remove(); calcolaTotale();">
                    ✖
                </button>
            </div>
        `;

        container.appendChild(div);
        calcolaTotale();
    }

    function cambiaQuantita(selectElement) {
        const prodottoNome = selectElement.selectedOptions[0].text.toLowerCase();
        const riga = selectElement.closest(".row");
        const campo = riga.querySelector(".quantita-input");

        if (prodottoNome.includes("lasagne pronte")) {
            campo.placeholder = "Formato (es. 1x2, 1x4, 1x6)";
        } else {
            campo.placeholder = "kg (es. 0.5)";
        }
    }

    function calcolaTotale() {
        let totale = 0;

        const righe = document.querySelectorAll("#prodotti-container .row");

        righe.forEach(riga => {
            const select = riga.querySelector("select[name='prodotto']");
            const prodottoId = select.value;
            const prodottoNome = select.selectedOptions[0].text.toLowerCase();
            const prezzoUnitario = prezzi[prodottoId] || 0;

            const campo = riga.querySelector(".quantita-input");
            let valore = campo.value.trim();

            let quantità = 0;

            if (prodottoNome.includes("lasagne pronte")) {
                if (valore !== "") quantità = 1;
            } else {
                quantità = parseFloat(valore) || 0;
            }

            const subtotale = prezzoUnitario * quantità;
            riga.querySelector(".prezzo-unitario").textContent = subtotale.toFixed(2) + " €";

            totale += subtotale;
        });

        document.getElementById("totale").textContent = totale.toFixed(2);
    }

    // inizializza righe già presenti
    document.querySelectorAll("#prodotti-container select[name='prodotto']").forEach(sel => {
        cambiaQuantita(sel);
    });
    calcolaTotale();
</script>

        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-success">💾 Salva modifiche</button>
            <button type="button" class="btn btn-secondary" onclick="history.back()">⬅ Annulla</button>
        </div>

    </form>
</div>

</body>
</html>
